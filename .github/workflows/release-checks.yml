name: Release checks

on:
  pull_request:
  push:
    branches:
      - "release/**"
      - "feature/**"
      - "fix/**"

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["7.4", "8.1", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: find . -type f -name "*.php" -not -path "./.git/*" -print0 | xargs -0 -n1 php -l

  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build WordPress.org package tree
        run: |
          mkdir -p build/rejoyan-store-health
          cp rejoyan-store-health.php uninstall.php readme.txt LICENSE build/rejoyan-store-health/
          cp -R assets src languages build/rejoyan-store-health/
      - name: Official WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./build/rejoyan-store-health
      - name: Build installable ZIP
        run: |
          cd build
          zip -r rejoyan-store-health-1.0.0.zip rejoyan-store-health
      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: rejoyan-store-health-1.0.0
          path: build/rejoyan-store-health-1.0.0.zip
          if-no-files-found: error
          retention-days: 14
