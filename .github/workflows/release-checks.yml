name: Release checks

on:
  pull_request:
  push:
    branches:
      - "release/**"
      - "feature/**"
      - "fix/**"

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["7.4", "8.1", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: find . -type f -name "*.php" -not -path "./.git/*" -print0 | xargs -0 -n1 php -l

  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build WordPress.org package tree
        run: |
          mkdir -p build/flow-store-check
          cp flow-store-check.php uninstall.php readme.txt LICENSE build/flow-store-check/
          cp -R assets src languages build/flow-store-check/
      - name: Official WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./build/flow-store-check
      - name: Build installable ZIP
        run: |
          cd build
          zip -r flow-store-check-1.0.0.zip flow-store-check
      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: flow-store-check-1.0.0
          path: build/flow-store-check-1.0.0.zip
          if-no-files-found: error
          retention-days: 14

  wporg-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install asset dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python3 -m pip install --disable-pip-version-check pillow
      - name: Build WordPress.org directory assets
        run: |
          python3 tools/build-wporg-assets.py --output build/wporg-assets
          python3 tools/build-wporg-branding.py --output build/wporg-assets
      - name: Validate asset names and dimensions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('build/wporg-assets')
          expected = {
              'icon-128x128.png': (128, 128),
              'icon-256x256.png': (256, 256),
              'banner-772x250.png': (772, 250),
              'banner-1544x500.png': (1544, 500),
              'screenshot-1.png': (1280, 800),
              'screenshot-2.png': (1280, 800),
              'screenshot-3.png': (1280, 800),
          }
          for name, size in expected.items():
              path = root / name
              if not path.is_file():
                  raise SystemExit(f'Missing asset: {name}')
              with Image.open(path) as image:
                  if image.size != size:
                      raise SystemExit(f'{name}: {image.size} != {size}')
          print('All WordPress.org assets validated.')
          PY
      - name: Upload WordPress.org asset preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: flow-store-check-wporg-assets
          path: build/wporg-assets/
          if-no-files-found: error
          retention-days: 14
